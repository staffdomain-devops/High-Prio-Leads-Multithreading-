name: Route B — Emails 2, 3

# Follow-ups after a call round, generated from a generic call scenario.
# Round 1: email_2 per contact. Round 2: email_3 per contact.

on:
  workflow_call:
    inputs:
      round:
        type: string
        required: true
      contacts:
        description: JSON list of contact IDs
        type: string
        required: true
      dry_run:
        type: string
        required: false
        default: "false"

jobs:
  email:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        contact_id: ${{ fromJSON(inputs.contacts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: ${{ runner.temp }}
      - name: Generate + write email
        run: python scripts/generate_route_b.py
        env:
          CONTACT_ID: ${{ matrix.contact_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUNNER_TEMP: ${{ runner.temp }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: email-${{ matrix.contact_id }}
          path: |
            ${{ runner.temp }}/email_${{ matrix.contact_id }}.json
            ${{ runner.temp }}/raw_${{ matrix.contact_id }}.txt
          if-no-files-found: ignore
          retention-days: 7
